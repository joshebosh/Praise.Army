name: Export Bible Audio Index

# Rebuilds web/public/data/bibleMemIndex.json from the live Firestore
# BibleMem/config collections. Run this whenever the audio library changes.
# Requires a repo secret: FIREBASE_SERVICE_ACCOUNT_JSON (Firebase Admin key).
# The key is only ever held in the Actions runner's memory/env for this job;
# it is never written to a file or committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install export script dependencies
        working-directory: scripts
        run: npm install

      - name: Run export
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node export-bible-index.mjs

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/bibleMemIndex.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update Bible audio index"
          git push

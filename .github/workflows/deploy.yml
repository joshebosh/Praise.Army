name: Deploy Praise Army (Songs + BibleMem)

# One workflow, one artifact: the original songs page at "/" plus the
# BibleMem app at "/biblemem/".
#
# The Drive audio index (web/public/data/bibleMemIndex.json) is checked
# into git like normal data, NOT regenerated on every push -- the crawl
# takes ~4 minutes (1,189 Drive folder listings) and the audio library
# barely changes, so re-running it on every CSS tweak was pure waste.
# Regenerate it manually: Actions tab -> "Run workflow" -> check
# "Refresh Bible audio index".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_index:
        description: "Refresh Bible audio index (re-crawl Drive, ~4 min)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # TEMPORARY: diagnose "Failed to fetch" in production. The key never
      # appears in output -- only status codes/response bodies, which GitHub
      # also auto-masks if they happened to contain the secret value anyway.
      - name: Diagnose Drive API key (no key value printed)
        env:
          KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          echo "--- metadata fetch, correct referrer + resourceKey header ---"
          curl -sS -o /tmp/resp1.json -w "HTTP_STATUS=%{http_code}\n" \
            -H "Referer: https://praise.army/biblemem/" \
            -H "X-Goog-Drive-Resource-Keys: 0ByK9asbulrf_TzRDNEJNcE1QWlk/0-jzTWf9VAw5yrFFgcchnt6g" \
            "https://www.googleapis.com/drive/v3/files/0ByK9asbulrf_TzRDNEJNcE1QWlk?fields=id,name,mimeType,size&key=${KEY}"
          cat /tmp/resp1.json
          echo ""
          echo "--- CORS preflight (OPTIONS), same as the browser sends ---"
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://praise.army" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: x-goog-drive-resource-keys" \
            "https://www.googleapis.com/drive/v3/files/0ByK9asbulrf_TzRDNEJNcE1QWlk?alt=media&key=${KEY}"

      - name: Export Bible audio index from Drive
        if: github.event.inputs.refresh_index == 'true'
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install
          node export-bible-index.mjs

      - name: Commit refreshed index
        if: github.event.inputs.refresh_index == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/bibleMemIndex.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Refresh Bible audio index"
          git push

      - name: Install BibleMem dependencies
        working-directory: web
        run: npm ci

      - name: Build BibleMem
        working-directory: web
        env:
          VITE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: npm run build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp index.html site/
          cp CNAME site/
          cp favicon.ico site/
          mkdir -p site/biblemem
          cp -r web/dist/. site/biblemem/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Praise Army (Songs + BibleMem)

# One workflow, one artifact: the original songs page at "/" plus the
# BibleMem app at "/biblemem/". Runs the Firestore export and the build in
# the same job so the deployed audio index is never stale.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export Bible audio index from Firestore
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm install
          node export-bible-index.mjs

      - name: Install BibleMem dependencies
        working-directory: web
        run: npm ci

      - name: Build BibleMem
        working-directory: web
        run: npm run build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp index.html site/
          cp CNAME site/
          mkdir -p site/biblemem
          cp -r web/dist/. site/biblemem/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
